<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CtrlChain Driver — Onboarding Prototype</title>
<script>
  /* Default to light theme regardless of system preference; remember
     a manual choice via localStorage. Runs before CSS to avoid a
     flash of the wrong theme. */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('cca-theme'); } catch (e) { /* ignore */ }
    var isDark = saved === 'dark';
    document.documentElement.classList.add(isDark ? 'dark' : 'light');
    // Shoelace scopes its design tokens under these theme classes — kept in
    // sync with our own light/dark class by toggleTheme() in app.js.
    document.documentElement.classList.add(isDark ? 'sl-theme-dark' : 'sl-theme-light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="icon" href="assets/logo-icon.svg" />
<!-- Shoelace: web-component UI primitives (accordion, bottom-sheet drawer, form
     controls) so per-stop/milestone interactions don't get built from scratch —
     re-themed to CCA's own tokens via the bridge block at the top of styles.css. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css" />
<script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
<!-- GitHub Pages caches these for 10 min (Cache-Control: max-age=600). Bump ?v=N
     on every deploy that changes styles.css/app.js so reviewers don't see stale
     content right after an update. -->
<link rel="stylesheet" href="colors.css?v=119" />
<link rel="stylesheet" href="themes.css?v=119" />
<link rel="stylesheet" href="styles.css?v=119" />
</head>
<body>

  <div class="proto-controls" role="navigation" aria-label="Prototype controls">
    <div class="proto-controls__flows" role="tablist" aria-label="Choose a flow to preview">
      <button type="button" class="proto-flow-btn" data-flow="self-reg" onclick="App.switchFlow('self-reg')">Self-Registration</button>
      <button type="button" class="proto-flow-btn" data-flow="portal" onclick="App.switchFlow('portal')">Portal-Based (Magic Link)</button>
      <button type="button" class="proto-flow-btn" data-flow="returning" onclick="App.switchFlow('returning')">Returning Driver</button>
      <button type="button" class="proto-flow-btn" data-flow="guest" onclick="App.switchFlow('guest')">Guest / One-Off</button>
    </div>
    <div class="proto-controls__actions">
      <button type="button" class="proto-icon-btn proto-theme-btn" onclick="App.toggleTheme()" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      <button type="button" class="proto-icon-btn" onclick="App.restartFlow()" title="Restart current flow" aria-label="Restart current flow">&#8635;</button>
    </div>
  </div>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__icons">&#9679;&#9679;&#9679; &#128246; &#128267;</span>
    </div>
    <div id="app" class="app-root"></div>
  </div>

  <p class="proto-footnote">CtrlChain Driver App — onboarding prototype for stakeholder review. Not production code.</p>

  <div id="reviewer-sticky" class="reviewer-sticky" style="display:none;"></div>
  <div id="context-sticky" class="context-sticky" style="display:none;"></div>

<script src="app.js?v=119"></script>
</body>
</html>
